# Local development / testing only (production compose lives in TheDevs-cz/lily.srv).
# Zero config:   docker compose up --build        → http://localhost:3000  (password "dev-password", /k/dev-token)
# Hot reload:    docker compose --profile dev up dev   → http://localhost:3001 (next dev, bind mount)
# Tests:         docker compose --profile test run --rm test
name: fotbal-fm-finances-planner

x-app-env: &app-env
  APP_PASSWORD: ${APP_PASSWORD:-dev-password}
  APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-dev-token}
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-0000000000}
  UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U planner -d planner"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    image: fotbal-fm-finances-planner:local
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://planner:planner@postgres:5432/planner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: fotbal-fm-finances-planner:local
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://planner:planner@postgres:5432/planner
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # next dev with a bind mount (hot reload). Runs migrations first.
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && node scripts/migrate.mjs && npx next dev -H 0.0.0.0 -p 3000"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://planner:planner@postgres:5432/planner
      UPLOAD_DIR: /app/data/uploads
      WATCHPACK_POLLING: "true"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  # Unit + integration tests against the compose Postgres (database planner_test).
  test:
    profiles: ["test"]
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm test && npm run test:integration"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://planner:planner@postgres:5432/planner_test
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  dev_node_modules:
  dev_next:
  test_node_modules:
